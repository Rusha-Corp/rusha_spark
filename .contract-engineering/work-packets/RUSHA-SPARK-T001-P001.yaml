acceptance_criteria:
  - The image uses Spark 4.1.4, Scala 2.13.17, Python 3.12.16, Hadoop 3.4.2, and Java 17, with connector versions from the approved spec.
  - Image startup checks confirm the Spark runtime, connector jars, S3A class, Hadoop native code, and working Iceberg and Delta read/write paths.
  - The Thrift entrypoint does not emit AWS credential values to logs.
  - CI uses SHA-pinned actions, read-only permissions for PR validation, and a main-only GHCR publish job with packages: write scoped to that job.
  - CI publishes the short-SHA and 4.1.4 tags with OCI source metadata and provenance, then verifies both remote tags resolve to the pushed digest.
  - No ECR infrastructure, cluster resources, secrets, or deployment rollout are changed.
